apiVersion: v1
kind: ServiceAccount
metadata:
  name: zyvor-qa
  labels:
    app: zyvor-qa-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zyvor-qa-dashboard-reader
  labels:
    app: zyvor-qa-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]   # delete = dashboard pod-restart button
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zyvor-qa-dashboard-reader
  labels:
    app: zyvor-qa-agent
subjects:
  - kind: ServiceAccount
    name: zyvor-qa
roleRef:
  kind: Role
  name: zyvor-qa-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
