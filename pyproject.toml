[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zyvor-qa-agent"
version = "0.3.0"
description = "Autonomous AI QA agent for Zyvor platform testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyGithub>=2.4",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
knowledge = [
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langchain-qdrant[fastembed]==1.1.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "qdrant-client>=1.15.1,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "pypdf>=5.0.0,<7.0.0",
    "orjson>=3.10.0,<4.0.0",
]

[project.scripts]
zyvor-qa = "orchestrator.cli:main"
zyvor-qa-knowledge-ingest = "scripts.knowledge_ingest:main"
zyvor-qa-knowledge-evaluate = "scripts.knowledge_evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "agents*", "github*", "knowledge*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# cli.py filters warnings before importing heavy modules — imports intentionally follow.
"orchestrator/cli.py" = ["E402"]
